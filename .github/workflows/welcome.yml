# Welcome first-time contributors

name: 'Welcome first-time contributors'

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            // Check if this is the author's first PR to this repo
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              creator: author,
              per_page: 2
            });

            if (prs.length === 1) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: [
                  `Welcome @${author}! 🎉`,
                  '',
                  'Thanks for your first contribution to PrintBridge!',
                  '',
                  'A maintainer will review your PR soon. In the meantime:',
                  '- Make sure CI checks pass',
                  '- Check out our [Contributing Guide](../blob/main/CONTRIBUTING.md) for guidelines',
                  '- Join the [Discussions](../../discussions) if you have questions',
                  '',
                  'We appreciate you taking the time to contribute! 🙌'
                ].join('\n')
              });
            }
