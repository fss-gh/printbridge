# GitHub Stale Issue/PR Management
# Closes issues and PRs with no activity after a set period.

name: 'Close stale issues and PRs'

on:
  schedule:
    - cron: '30 1 * * *'  # Runs at 01:30 UTC every day

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 90
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,good first issue,help wanted'
          stale-issue-message: |
            This issue has been inactive for 60 days and is being marked as stale.
            It will be closed in 30 days if there is no further activity.
            If this is still relevant, please comment or remove the stale label.
          close-issue-message: |
            This issue was closed due to inactivity for 90 days.
            If this is still relevant, please reopen it or create a new issue with updated details.

          # Pull Requests
          days-before-pr-stale: 30
          days-before-pr-close: 60
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,needs-review,needs-changes'
          stale-pr-message: |
            This PR has been inactive for 30 days and is being marked as stale.
            It will be closed in 30 days if there is no further activity.
            If you're still working on this, please push updates or comment.
          close-pr-message: |
            This PR was closed due to inactivity for 60 days.
            Feel free to reopen it or submit a new PR when you're ready.

          # General
          operations-per-run: 30
