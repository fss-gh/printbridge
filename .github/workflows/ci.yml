name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Check syntax
        run: |
          python -m py_compile agent.py
          python -m py_compile generate_icon.py

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=printbridge --cov-report=term

      - name: Import check
        run: |
          python -c "from printbridge.config import PrintBridgeConfig; print('Config OK')"
          python -c "from printbridge.server.app import create_app; print('Server OK')"
          python -c "from printbridge.tspl.label_builder import build_tspl_label; print('TSPL OK')"

  windows-build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Check syntax
        run: |
          python -m py_compile agent.py
          python -m py_compile generate_icon.py
          python -m py_compile tspl_sender.py

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
