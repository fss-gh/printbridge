# Auto-label issues and PRs based on content

name: 'Auto-label issues'

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Label based on title prefix
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue || context.payload.pull_request;
            const title = issue.title.toLowerCase();
            const labels = [];

            // Bug reports
            if (title.includes('[bug]') || title.includes('bug:') || title.includes('error') || title.includes('crash') || title.includes('fail')) {
              labels.push('bug');
            }

            // Feature requests
            if (title.includes('[feature]') || title.includes('feat:') || title.includes('feature:') || title.includes('add ') || title.includes('support ')) {
              labels.push('enhancement');
            }

            // Documentation
            if (title.includes('[docs]') || title.includes('docs:') || title.includes('readme') || title.includes('documentation')) {
              labels.push('documentation');
            }

            // Platform-specific
            if (title.includes('macos') || title.includes('mac os') || title.includes('darwin')) {
              labels.push('platform:macos');
            }
            if (title.includes('windows') || title.includes('win32')) {
              labels.push('platform:windows');
            }
            if (title.includes('linux') || title.includes('ubuntu') || title.includes('debian')) {
              labels.push('platform:linux');
            }

            // Breaking changes
            if (title.includes('breaking') || title.includes('[breaking]')) {
              labels.push('breaking');
            }

            if (labels.length > 0) {
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });
            }
