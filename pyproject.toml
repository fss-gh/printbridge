[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "printbridge"
version = "1.0.0"
description = "Silent local printing agent for web applications — print PDFs and thermal labels from any browser"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Anouar Sbia"},
]
keywords = ["printing", "thermal-printer", "tspl", "label", "pdf", "silent", "flask", "cross-platform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Printing",
]

[project.urls]
Homepage = "https://github.com/AnouarSbia/printbridge"
Repository = "https://github.com/AnouarSbia/printbridge"
Issues = "https://github.com/AnouarSbia/printbridge/issues"

[tool.setuptools.packages.find]
include = ["printbridge*"]

[tool.black]
line-length = 120
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
